<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ops Assistant</title>
<style>
  :root { --bg:#f2f5f7; --panel:#ffffff; --ink:#15212b; --muted:#5d6b78; --line:#d5dde4; --accent:#0b6e83; --err:#b3261e; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 820px; margin: 0 auto; padding: 32px 20px 64px; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; }
  p.sub { margin: 0 0 24px; color: var(--muted); }
  form { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px; }
  textarea { width: 100%; min-height: 84px; resize: vertical; border: 1px solid var(--line); border-radius: 6px; padding: 10px; font: inherit; }
  .row { display: flex; gap: 12px; align-items: center; justify-content: space-between; margin-top: 12px; flex-wrap: wrap; }
  select { font: inherit; padding: 8px; border: 1px solid var(--line); border-radius: 6px; background: #fff; }
  button { font: inherit; font-weight: 600; background: var(--accent); color: #fff; border: 0; border-radius: 6px; padding: 10px 18px; cursor: pointer; }
  button:disabled { opacity: .6; cursor: progress; }
  :focus-visible { outline: 3px solid #7cc4d4; outline-offset: 2px; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; margin: 12px 0 0; }
  .chips button { background: #e4edf0; color: var(--ink); font-weight: 500; padding: 6px 12px; font-size: .9rem; }
  #out { margin-top: 24px; }
  .answer { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--accent); border-radius: 8px; padding: 16px 20px; white-space: pre-wrap; }
  .error { border-left-color: var(--err); color: var(--err); }
  details { margin-top: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; }
  pre { overflow-x: auto; font-size: .85rem; }
  .status { color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Ops Assistant</h1>
  <p class="sub">Ask about an incident. It reads recent logs, metrics and latency, checks your runbooks and past incidents, then suggests a root cause.</p>

  <form id="f">
    <label for="q" class="sub">What is going wrong?</label>
    <textarea id="q" placeholder="Why is checkout slow?"></textarea>
    <div class="chips">
      <button type="button" data-q="Why is checkout slow and returning errors?">Checkout slow</button>
      <button type="button" data-q="Is anything unhealthy right now?">General health check</button>
    </div>
    <div class="row">
      <label>Look back <select id="win">
        <option value="15">15 minutes</option><option value="30" selected>30 minutes</option>
        <option value="60">1 hour</option><option value="180">3 hours</option></select></label>
      <button id="go" type="submit">Diagnose</button>
    </div>
  </form>
  <div id="out" aria-live="polite"></div>
</main>
<script src="config.js"></script>
<script>
const $ = id => document.getElementById(id), out = $("out");
document.querySelectorAll(".chips button").forEach(b => b.onclick = () => { $("q").value = b.dataset.q; $("q").focus(); });

$("f").addEventListener("submit", async e => {
  e.preventDefault();
  const question = $("q").value.trim();
  if (!question) { out.innerHTML = '<div class="answer error">Enter a question first.</div>'; return; }
  $("go").disabled = true;
  out.innerHTML = '<p class="status">Collecting logs and metrics, then asking the model. This can take 10 to 30 seconds.</p>';
  try {
    const r = await fetch(window.APP_CONFIG.apiUrl, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ question, window_minutes: +$("win").value })
    });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error || r.statusText);
    out.innerHTML = "";
    const a = document.createElement("div"); a.className = "answer"; a.textContent = d.answer; out.append(a);
    const det = document.createElement("details");
    det.innerHTML = "<summary>Evidence used</summary><pre></pre>";
    det.querySelector("pre").textContent = JSON.stringify(d.evidence, null, 2);
    out.append(det);
  } catch (err) {
    out.innerHTML = '<div class="answer error"></div>';
    out.firstChild.textContent = "Request failed: " + err.message;
  } finally { $("go").disabled = false; }
});
</script>
</body>
</html>
